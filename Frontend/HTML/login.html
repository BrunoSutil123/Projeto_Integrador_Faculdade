<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Desenvolvimento de Projeto integrador para a faculdade">
    <link rel="stylesheet" href="/Frontend/CSS/login.css">
    <script src="/Frontend/JS/login.js" defer></script>
    <title>Login / Alexsani Semijoias e Acessórios</title>
</head>

<body>
    <main class="principal">
        <section class="container_logo">
            <figure> <img src="/Frontend/IMG/logo_cliente.png" alt="Logo cliente"> </figure>
        </section>

        <section class="container_login">
            <article class="container">
                <h1>Bem Vindo</h1>

                <form id="loginForm" class="inf_login">
                    <div class="login">
                        <label for="username">Login</label> 
                        <input type="text" id="username" placeholder="Digite seu login.." required>
                    </div>

                    <div class="senha">
                        <label for="password">Senha</label>
                        <input type="password" id="password" placeholder="Digite sua senha.." required>
                        
                        <a href="#">Esqueceu a senha?</a> </div>
                        <button class="btn" type="submit">Entrar</button>
                </form>
                
            </article>
        </section>
    </main>
</body>

</html>
